<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anwesenheits-Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=1.24">
</head>
<body>

    <div class="topbar">
        <div>
            <div class="eyebrow">Anwesenheit · Jahresansicht</div>
            <h1 id="dashboardTitle">Anwesenheits-Dashboard</h1>
        </div>
        <div class="range-controls">
            <label>Zeitraum</label>


            <select id="monthBox"></select>
            <select id="yearBox"></select>
            <button class="btn btn-primary" id="applyButton">Übernehmen</button>
        </div>
    </div>

    <div class="kpi-strip" id="kpiStrip"></div>

    <div class="section-title" id="heroTitle"><h2>Aktueller Monat</h2></div>
    <div class="hero" id="hero"></div>

    <div class="section-title"><h2>Jahresübersicht</h2></div>
    <div class="year-grid" id="yearGrid"></div>

    <div class="legend" id="legend"></div>

    <div class="footer">
        <div class="quota-input">
            <span>Urlaubskontingent</span>
            <input type="number" id="urlaubInput" min="0" max="365" step="1">
            <button class="btn btn-ghost" id="urlaubApply">OK</button>
        </div>
        <div class="footer-actions">
            <button class="btn btn-ghost" id="exportButton" title="Aktuelle Daten als Backup-Datei herunterladen">Backup exportieren</button>
            <button class="btn btn-ghost" id="importButton" title="Backup-Datei importieren (überschreibt aktuelle Daten)">Backup importieren</button>
            <input type="file" id="importFile" accept=".json,application/json,.csv,text/csv" class="hidden">
        </div>
    </div>
    <div id="version" class="version">Version 1.3 vom 12.08.2026 · <a href="Bedienungsanleitung.pdf" target="_blank">Bedienungsanleitung</a></div>

    <div id="modalOverlay" class="overlay hidden">
        <div class="dialog">
            <h3 id="dialogTitle">Eintrag hinzufügen</h3>
            <div class="dialog-fields">
                <div class="field-group">
                    <label for="dialogDate">Startdatum:</label>
                    <input type="date" id="dialogDate">
                    <label class="dialog-check">
                        <input type="checkbox" id="dialogGebucht">
                        gebucht
                    </label>
                </div>
                <div class="field-group">
                    <label for="dialogEndDate">Enddatum:</label>
                    <input type="date" id="dialogEndDate">
                </div>
                <div class="field-group">
                    <label for="dialogType">Art:</label>
                    <select id="dialogType"></select>
                </div>
            </div>
            <div class="dialog-buttons">
                <button id="dialogDelete" class="btn btn-danger hidden">Löschen</button>
                <button id="dialogOk" class="btn btn-primary">OK</button>
                <button id="dialogCancel" class="btn btn-ghost">Abbrechen</button>
            </div>
        </div>
    </div>

    <div id="confirmOverlay" class="overlay hidden">
        <div class="dialog">
            <h3>Einträge löschen</h3>
            <div class="dialog-fields" id="confirmText"></div>
            <div class="dialog-buttons">
                <button id="confirmDelete" class="btn btn-danger">Löschen</button>
                <button id="confirmCancel" class="btn btn-ghost">Abbrechen</button>
            </div>
        </div>
    </div>

    <script src="app.js?v=1.24"></script>
</body>
</html>
